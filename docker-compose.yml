version: '3.9'
services:
  server:
    build: ./server
    container_name: careguardian-server
    env_file:
      - ./server/.env
    ports:
      - '5000:5000'
    restart: unless-stopped

  client:
    build: ./client
    container_name: careguardian-client
    ports:
      - '8080:80'
    depends_on:
      - server
    restart: unless-stopped
